<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vigia Auto mudou de endereço</title>
<link rel="canonical" href="https://mpteixeirarj-glit.github.io/auto/">
<meta http-equiv="refresh" content="2;url=/auto/">
<style>body{background:#0b0d14;color:#e0e0e0;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:16px}a{color:#00e5ff}</style>
<script>
/* Endereço antigo do Vigia Auto. O app agora mora em https://mpteixeirarj-glit.github.io/auto/
   Tira o service worker velho deste endereço (senão ele continuaria servindo a versão antiga)
   e segue para o novo, mantendo ?parâmetros e #âncora. Os dados ficam no aparelho:
   o endereço (origem) é o mesmo, então o app novo os encontra. */
(function () {
  var destino = '/auto/' + location.search + location.hash;
  var base = location.pathname.replace(/[^/]*$/, '');
  var feito = function () { location.replace(destino); };
  if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.filter(function (r) { return new URL(r.scope).pathname.indexOf('/AUTO-VIGIA-/') === 0; })
        .map(function (r) { return r.unregister(); }));
    }).then(feito, feito);
    setTimeout(feito, 1500);
  } else feito();
})();
</script>
</head>
<body><p>O Vigia Auto mudou para<br><a href="/auto/">mpteixeirarj-glit.github.io/auto/</a></p></body>
</html>
