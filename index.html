<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Auto-Vigia">
  <title>Auto-Vigia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/vigia-pixel.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="version.js"></script>
</head>
<body>
  <header id="topo">
    <div class="hl1">
      <h1><span class="engrenagem" aria-hidden="true">⚙</span> AUTO-<b>VIGIA</b></h1>
      <a class="hbtn txt esp" href="https://mpteixeirarj-glit.github.io/Vigia-energy-/" title="Voltar ao hub dos apps Vigia">HUB</a>
    </div>
    <div class="hl2">
      <span class="ver" id="versao-topo"></span>
      <button type="button" class="sync entrar" id="sync-status" aria-label="Entrar com Google">🔑 ENTRAR</button>
      <span class="relogio" id="relogio"></span>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <nav id="bottom-nav" aria-label="Navegação">
    <button type="button" data-screen="inicio"><span class="e" aria-hidden="true">🏠</span>Início</button>
    <button type="button" data-screen="historico"><span class="e" aria-hidden="true">📋</span>Histórico</button>
    <button type="button" data-screen="veiculo"><span class="e" aria-hidden="true">🚙</span>Veículo</button>
    <button type="button" data-screen="lembretes"><span class="e" aria-hidden="true">🔔</span>Lembretes</button>
    <button type="button" data-screen="mais"><span class="e" aria-hidden="true">⋯</span>Mais</button>
  </nav>

  <div id="toast" role="status" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-msg">
      <p id="modal-msg"></p>
      <div class="modal-acoes">
        <button type="button" class="btn" id="modal-nao">Cancelar</button>
        <button type="button" class="btn amarelo" id="modal-sim">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="vendor/jspdf.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
