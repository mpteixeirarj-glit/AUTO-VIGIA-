<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Auto-Vigia</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Auto-Vigia">
</head>
<body>
  <header>
    <h1>Auto-Vigia</h1>
    <p class="slogan">Seu copiloto na manutenção</p>
    <p class="version">v0.3</p>
  </header>
  <div id="app-header"></div>
  <main id="app"></main>
  <nav id="bottom-nav">
    <button data-screen="inicio" class="active">
      <span class="icon">🏠</span>
      <span>Início</span>
    </button>
    <button data-screen="historico">
      <span class="icon">📋</span>
      <span>Histórico</span>
    </button>
    <button data-screen="veiculos">
      <span class="icon">🚗</span>
      <span>Veículos</span>
    </button>
    <button data-screen="lembretes">
      <span class="icon">🔔</span>
      <span>Lembretes</span>
    </button>
    <button data-screen="mais">
      <span class="icon">⋯</span>
      <span>Mais</span>
    </button>
  </nav>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
